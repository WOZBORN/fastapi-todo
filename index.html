<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>XSS demo</title>
    <style>
        body {
            font-family: sans-serif;
        }
    </style>
</head>
<body>

<h2>ToDo (XSS demo)</h2>

<input id="name" placeholder="Название">
<br><br>
<textarea id="description" placeholder="Описание"></textarea>
<br><br>
<button onclick="addTask()">Добавить задачу</button>

<hr>

<h3>Список задач</h3>
<div id="tasks"></div>

<script>
const API = "http://127.0.0.1:8000";

function loadTasks() {
    fetch(API + "/tasks")
        .then(res => res.json())
        .then(data => {
            const tasksDiv = document.getElementById("tasks");
            tasksDiv.innerHTML = "";

            data.forEach((task, i) => {
                // ❌ УЯЗВИМОСТЬ: innerHTML без экранирования
                tasksDiv.innerHTML += `
                    <div style="border:1px solid #ccc; margin:5px; padding:5px">
                        <b>${task.name}</b><br>
                        ${task.description}
                    </div>
                `;
            });
        });
}

function addTask() {
    fetch(API + "/tasks", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: document.getElementById("name").value,
            description: document.getElementById("description").value
        })
    }).then(() => loadTasks());
}

loadTasks();
</script>

</body>
</html>
